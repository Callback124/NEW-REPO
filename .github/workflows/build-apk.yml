name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only holds lib/ and pubspec.yaml, so generate the Android shell here.
      - name: Generate Android project
        run: |
          flutter create --org app.stratus --project-name stratus --platforms=android /tmp/shell
          cp -r /tmp/shell/android ./android
          cp /tmp/shell/.metadata ./.metadata

          # FFmpegKit HTTPS requires Android API 24 or newer.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = re.sub(r'minSdk = flutter\\.minSdkVersion', 'minSdk = 24', s)
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = re.sub(r'minSdkVersion flutter\\.minSdkVersion', 'minSdkVersion 24', s)
              p.write_text(s)
          PY

          # Native Android DownloadManager keeps downloads alive outside the Flutter UI.
          mkdir -p android/app/src/main/kotlin/app/stratus/stratus
          cat > android/app/src/main/kotlin/app/stratus/stratus/MainActivity.kt <<'KOTLIN'
          package app.stratus.stratus

          import android.app.DownloadManager
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Environment
          import android.os.Build
          import android.database.Cursor
          import android.content.ContentValues
          import android.provider.MediaStore
          import java.io.File
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "app.stratus/downloads"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          val manager = getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                          try {
                              when (call.method) {
                                  "enqueue" -> {
                                      val url = call.argument<String>("url") ?: throw IllegalArgumentException("Missing download URL")
                                      val title = call.argument<String>("title") ?: "Video download"
                                      val fileName = (call.argument<String>("fileName") ?: "video.mp4")
                                          .replace(Regex("[^A-Za-z0-9._-]"), "_")
                                      val gallery = call.argument<Boolean>("gallery") ?: false
                                      val request = DownloadManager.Request(Uri.parse(url))
                                          .setTitle(title)
                                          .setDescription("Stratus · Downloads")
                                          .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                                      if (gallery) {
                                          request.setDestinationInExternalPublicDir(Environment.DIRECTORY_MOVIES, "Stratus/$fileName")
                                      } else {
                                          request.setDestinationInExternalFilesDir(this, Environment.DIRECTORY_MOVIES, "Stratus/$fileName")
                                      }
                                      request.setAllowedOverMetered(true)
                                          .setAllowedOverRoaming(true)
                                      val headers = call.argument<Map<String, String>>("headers") ?: emptyMap()
                                      headers.forEach { (key, value) -> request.addRequestHeader(key, value) }
                                      result.success(manager.enqueue(request))
                                  }
                                  "saveMergedToGallery" -> {
                                      val sourcePath = call.argument<String>("path") ?: throw IllegalArgumentException("Missing merged file")
                                      val fileName = (call.argument<String>("fileName") ?: "video.mp4").replace(Regex("[^A-Za-z0-9._-]"), "_")
                                      val source = File(sourcePath)
                                      if (!source.exists() || source.length() == 0L) throw IllegalStateException("Merged video file is missing")
                                      val values = ContentValues().apply {
                                          put(MediaStore.MediaColumns.DISPLAY_NAME, fileName)
                                          put(MediaStore.MediaColumns.MIME_TYPE, "video/mp4")
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                              put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/Stratus")
                                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                                          }
                                      }
                                      val uri = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: throw IllegalStateException("Could not create Gallery video")
                                      try {
                                          contentResolver.openOutputStream(uri)?.use { output -> source.inputStream().use { input -> input.copyTo(output) } } ?: throw IllegalStateException("Could not write Gallery video")
                                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                              val ready = ContentValues().apply { put(MediaStore.MediaColumns.IS_PENDING, 0) }
                                              contentResolver.update(uri, ready, null, null)
                                          }
                                          result.success(true)
                                      } catch (e: Exception) {
                                          contentResolver.delete(uri, null, null)
                                          throw e
                                      }
                                  }
                                  "queryAll" -> {
                                      val ids = call.argument<List<Number>>("ids") ?: emptyList()
                                      val values = ids.mapNotNull { queryOne(manager, it.toLong()) }
                                      result.success(values)
                                  }
                                  "cancel", "remove" -> {
                                      val id = call.argument<Number>("id")?.toLong()
                                          ?: throw IllegalArgumentException("Missing download ID")
                                      result.success(manager.remove(id) > 0)
                                  }
                                  "open" -> {
                                      val id = call.argument<Number>("id")?.toLong()
                                          ?: throw IllegalArgumentException("Missing download ID")
                                      val row = queryOne(manager, id)
                                      val local = row?.get("localUri") as? String
                                          ?: throw IllegalStateException("Downloaded file is not available yet")
                                      val uri = Uri.parse(local)
                                      val mime = contentResolver.getType(uri) ?: "video/mp4"
                                      val intent = Intent(Intent.ACTION_VIEW).setDataAndType(uri, mime)
                                          .addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                      startActivity(intent)
                                      result.success(true)
                                  }
                                  else -> result.notImplemented()
                              }
                          } catch (e: Exception) {
                              result.error("DOWNLOAD_ERROR", e.message, null)
                          }
                      }
              }

              private fun queryOne(manager: DownloadManager, id: Long): Map<String, Any?>? {
                  val cursor: Cursor = manager.query(DownloadManager.Query().setFilterById(id)) ?: return null
                  cursor.use {
                      if (!it.moveToFirst()) return null
                      val statusValue = it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS))
                      val status = when (statusValue) {
                          DownloadManager.STATUS_PENDING -> "queued"
                          DownloadManager.STATUS_RUNNING -> "running"
                          DownloadManager.STATUS_PAUSED -> "paused"
                          DownloadManager.STATUS_SUCCESSFUL -> "complete"
                          DownloadManager.STATUS_FAILED -> "failed"
                          else -> "queued"
                      }
                      val localIndex = it.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI)
                      val localUri = if (localIndex >= 0 && !it.isNull(localIndex)) it.getString(localIndex) else null
                      return mapOf(
                          "id" to id,
                          "status" to status,
                          "downloaded" to it.getLong(it.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)),
                          "total" to it.getLong(it.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)),
                          "localUri" to localUri,
                          "reason" to it.getInt(it.getColumnIndexOrThrow(DownloadManager.COLUMN_REASON))
                      )
                  }
              }
          }
          KOTLIN
          # Permit immersive playback to extend into display-cutout areas (notches/punch holes).
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/res/values/styles.xml")
          s = p.read_text()
          s = re.sub(
              r'(<style name="(?:LaunchTheme|NormalTheme)"[^>]*>)',
              lambda m: m.group(1) + "\n        <item name=\"android:windowLayoutInDisplayCutoutMode\">shortEdges</item>",
              s)
          p.write_text(s)
          PY

      - name: Allow network access
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' "$MANIFEST"
          grep -n "INTERNET\|usesCleartextTraffic" "$MANIFEST"

      # The Android lint tool crashes inside plugin modules. Lint is not needed to produce an APK.
      - name: Skip lintVital tasks
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              tasks.configureEach {
                  if (name.startsWith("lintVital")) {
                      enabled = false
                  }
              }
          }
          EOF
          else
            cat >> android/build.gradle <<'EOF'

          subprojects {
              tasks.configureEach { task ->
                  if (task.name.startsWith("lintVital")) {
                      task.enabled = false
                  }
              }
          }
          EOF
          fi
          tail -12 android/build.gradle*

      - name: Download provider placeholder image asset
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --retry-delay 2 'https://h5-static.aoneroom.com/ssrStatic/mbOfficial/public/_nuxt/image-1.apJjVir2.svg' --output assets/provider_placeholder.svg
          test -s assets/provider_placeholder.svg
          head -c 80 assets/provider_placeholder.svg

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: stratus-apk
          path: build/app/outputs/flutter-apk/app-release.apk
